<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stok Makanan Interaktif</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 400px;
      margin: 0 auto 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }
    .status.bagus {
      color: green;
      font-weight: bold;
    }
    .status.hampir-expired {
      color: orange;
      font-weight: bold;
    }
    .status.expired {
      color: red;
      font-weight: bold;
    }
    .delete-btn, .kurangi-btn {
      background: #d9534f;
      color: white;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      margin-right: 5px;
    }
    .kurangi-btn {
      background: #0275d8;
    }
  </style>
</head>
<body>
  <h1>🍱 Pengingat Stok Makanan</h1>

  <form id="form">
    <input type="text" id="nama" placeholder="Nama Makanan" required />
    <input type="number" id="berat" placeholder="Berat (kg)" min="0" step="0.1" required />
    <input type="date" id="expired" required />
    <button type="submit">Tambah</button>
  </form>

  <table id="tabel">
    <thead>
      <tr>
        <th>Nama Makanan</th>
        <th>Berat (kg)</th>
        <th>Tanggal Expired</th>
        <th>Status</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const form = document.getElementById('form');
    const tabelBody = document.querySelector('#tabel tbody');
    const namaInput = document.getElementById('nama');
    const beratInput = document.getElementById('berat');
    const expiredInput = document.getElementById('expired');

    let data = JSON.parse(localStorage.getItem('stokMakanan')) || [];

    function renderTable() {
      tabelBody.innerHTML = '';
      data.forEach((item, index) => {
        const tr = document.createElement('tr');
        const berat = parseFloat(item.berat);
        const expiredDate = new Date(item.expired);
        const today = new Date();
        const diffTime = expiredDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); // Menghitung selisih hari
        
        let statusClass = '';
        let statusText = '';
        
        if (diffDays > 7) {
          statusClass = 'bagus';
          statusText = 'Bagus';
        } else if (diffDays <= 7 && diffDays > 3) {
          statusClass = 'hampir-expired';
          statusText = 'Hampir Expired';
        } else if (diffDays <= 3 && diffDays >= 0) {
          statusClass = 'expired';
          statusText = 'Expired';
        } else {
          statusClass = 'expired';
          statusText = 'Expired';
        }

        tr.innerHTML = `
          <td>${item.nama}</td>
          <td>${berat.toFixed(1)}</td>
          <td>${item.expired}</td>
          <td class="status ${statusClass}">${statusText}</td>
          <td>
            <button class="kurangi-btn" onclick="kurangiBerat(${index})">Kurangi Berat</button>
            <button class="delete-btn" onclick="hapus(${index})">Hapus</button>
          </td>
        `;
        tabelBody.appendChild(tr);
      });
    }

    function hapus(index) {
      data.splice(index, 1);
      simpanData();
      renderTable();
    }

    function kurangiBerat(index) {
      const pengurangan = parseFloat(prompt("Kurangi berat (kg):", "0.1"));
      if (!isNaN(pengurangan) && pengurangan > 0) {
        data[index].berat = Math.max(0, parseFloat(data[index].berat) - pengurangan);
        simpanData();
        renderTable();
      }
    }

    function simpanData() {
      localStorage.setItem('stokMakanan', JSON.stringify(data));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nama = namaInput.value.trim();
      const berat = parseFloat(beratInput.value.trim());
      const expired = expiredInput.value;

      if (nama && !isNaN(berat) && expired) {
        data.push({ nama, berat, expired });
        simpanData();
        renderTable();
        namaInput.value = '';
        beratInput.value = '';
        expiredInput.value = '';
      }
    });

    renderTable();
  </script>
</body>
</html>
